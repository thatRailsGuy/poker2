plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.thatrailsguy.pokerhouse'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.thatrailsguy.pokerhouse'
        minSdk 26
        targetSdk 35
        // CI passes these from the git tag and run number; local builds fall back to the defaults.
        versionCode = (project.findProperty('versionCode') ?: '1').toInteger()
        versionName = project.findProperty('versionName') ?: '1.0.0'
    }

    // Release signing comes from env vars (set by CI from repo secrets). Without them, release builds are unsigned.
    def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')

    signingConfigs {
        if (keystorePath) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePath) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.12.1'
}

// The site is generated by `npm run build:app` into src/main/assets/www; fail early if it's missing.
tasks.register('checkSiteBuilt') {
    def index = file('src/main/assets/www/index.html')
    doLast {
        if (!index.exists()) {
            throw new GradleException("Site not built. Run `npm run build:app` from the repo root first.")
        }
    }
}
preBuild.dependsOn checkSiteBuilt
