# Local development without installing Node, Java, or the Android SDK on the host.
#
#   docker compose up web                       # dev server at http://localhost:8085
#   docker compose run --rm android             # build android/app/build/outputs/apk/debug/app-debug.apk
#
# Host ports are bound to 127.0.0.1 only. Change POKER_WEB_PORT if 8085 is taken.

services:
  web:
    image: node:22-bookworm-slim
    working_dir: /app
    command: sh -c "npm ci && npx @11ty/eleventy --serve --port=8080"
    ports:
      - "127.0.0.1:${POKER_WEB_PORT:-8085}:8080"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules

  android:
    profiles: ["android"]
    build:
      context: android
    platform: linux/amd64
    working_dir: /app
    command: sh -c "npm ci && npm run build:app && cd android && ./gradlew --no-daemon assembleDebug"
    volumes:
      - .:/app
      - android_node_modules:/app/node_modules
      - gradle_cache:/root/.gradle

volumes:
  web_node_modules:
  android_node_modules:
  gradle_cache:
